<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" fill="#020617"/>
  
  <!-- Money bag emoji -->
  <text x="90" y="125" font-family="Arial, sans-serif" font-size="90" text-anchor="middle">💰</text>
  
  <!-- Trending up chart above -->
  <polyline points="35,50 55,42 75,30 95,22 115,10" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
  
  <!-- Arrow tip -->
  <polyline points="105,8 115,10 112,18" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
  
  <!-- Chart dots -->
  <circle cx="35" cy="50" r="4" fill="#10b981"/>
  <circle cx="55" cy="42" r="4" fill="#10b981"/>
  <circle cx="75" cy="30" r="4" fill="#10b981"/>
  <circle cx="95" cy="22" r="4" fill="#10b981"/>
  <circle cx="115" cy="10" r="4" fill="#10b981"/>
</svg>
